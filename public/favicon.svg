  />
  <!-- Upper eyes -->
  <ellipse cx="27.5" cy="29" rx="2.7" ry="1.8" transform="rotate(-10 27.5 29)" fill="#ffb81c" />
  <ellipse cx="37.5" cy="27.5" rx="2.5" ry="1.7" transform="rotate(8 37.5 27.5)" fill="#ffb81c" />
  <!-- Iconic lower-jaw eyes -->
