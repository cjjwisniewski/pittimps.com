  <!-- Centered stylized Pit Imp head (swept-back crest, wide grin, four eyes) -->
  <path
    d="M15 41 C14 33 18 25 25 21 C31 17 39 14 50 15 C45 21 43 26 44 31 C48 34 48 40 44 44 C39 49 30 50 23 48 C18 46 16 44 15 41 Z"
    fill="#d3202a"
