name: Deploy to Azure Storage ($web)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Run Automated Tests
        run: npm run test

  build-and-deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sync Files to Azure Storage
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            # Sync dist/ to $web and prune stale hashed assets from prior deployments
            az storage blob sync \
              --container '$web' \
              --account-name pittimpscom \
              --source ./dist \
              --auth-mode login \
              --delete-destination true

            # Immutable content-hashed Vite bundles (JS, CSS, WOFF2): 1 year cache
            az storage blob upload-batch \
              --destination '$web' \
              --destination-path 'assets' \
              --account-name pittimpscom \
              --source ./dist/assets \
              --auth-mode login \
              --overwrite \
              --content-cache-control "public, max-age=31536000, immutable"

            # HTML pages: revalidate at browser, short edge TTL
            az storage blob upload-batch \
              --destination '$web' \
              --account-name pittimpscom \
              --source ./dist \
              --pattern "*.html" \
              --auth-mode login \
              --overwrite \
              --content-cache-control "public, max-age=0, s-maxage=300, must-revalidate"

            # Dynamic events markdown: short TTL so schedule updates propagate quickly
            az storage blob upload-batch \
              --destination '$web' \
              --account-name pittimpscom \
              --source ./dist \
              --pattern "events.md" \
              --auth-mode login \
              --overwrite \
              --content-cache-control "public, max-age=60, s-maxage=300, must-revalidate"

            # Static media, icons, sitemap, robots, security.txt
            for ext in webp jpg png svg ico xml txt; do
              az storage blob upload-batch \
                --destination '$web' \
                --account-name pittimpscom \
                --source ./dist \
                --pattern "*.$ext" \
                --auth-mode login \
                --overwrite \
                --content-cache-control "public, max-age=86400"
            done
